<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello Counsellor NG — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --forest: #1C3B2A;
    --forest-deep: #142A1E;
    --cream: #FAF8F2;
    --paper: #FFFFFF;
    --sage: #8CA88A;
    --moss: #4A6B4D;
    --ink: #16241A;
    --ink-soft: #4B594E;
    --line: #E4E0D2;
    --error: #A6432F;
    --amber: #A87C2E;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ---------------- Layout ---------------- */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  @media (min-width: 860px) {
    .app { flex-direction: row; }
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    background: var(--forest);
    color: var(--cream);
    padding: 1.1rem 1.25rem;
    padding-top: calc(1.1rem + env(safe-area-inset-top, 0px));
  }

  @media (min-width: 860px) {
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
    }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
  }

  .brand-badge {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(250,248,242,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 0.75rem;
    flex-shrink: 0;
  }

  .filters {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    margin-top: 1.1rem;
    padding-bottom: 0.2rem;
  }

  @media (min-width: 860px) {
    .filters {
      flex-direction: column;
      margin-top: 2.5rem;
      overflow: visible;
    }
  }

  .filter-btn {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(250,248,242,0.25);
    color: rgba(250,248,242,0.8);
    padding: 0.5rem 0.9rem;
    font-family: 'Public Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .filter-btn:hover { border-color: rgba(250,248,242,0.5); }

  .filter-btn.active {
    background: var(--cream);
    color: var(--forest-deep);
    border-color: var(--cream);
    font-weight: 600;
  }

  .filter-count {
    font-size: 0.75rem;
    opacity: 0.75;
  }

  .sidebar-foot {
    display: none;
  }

  @media (min-width: 860px) {
    .sidebar-foot {
      display: block;
      font-size: 0.8rem;
      color: rgba(250,248,242,0.55);
    }
  }

  .signout-btn {
    background: none;
    border: none;
    color: rgba(250,248,242,0.7);
    font-family: 'Public Sans', sans-serif;
    font-size: 0.8rem;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
    margin-top: 0.75rem;
  }
  .signout-btn:hover { color: var(--cream); }

  /* ---------------- Main ---------------- */
  .main {
    flex: 1;
    padding: 1.5rem 1.25rem 3rem;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }

  @media (min-width: 860px) {
    .main { padding: 3rem 3rem 4rem; }
  }

  .main-head h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.6rem;
    margin: 0 0 0.3rem;
    color: var(--forest-deep);
  }

  .main-head p {
    margin: 0 0 1.75rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .state-msg {
    color: var(--ink-soft);
    font-size: 0.9rem;
    padding: 2rem 0;
    text-align: center;
  }
  .state-msg.error { color: var(--error); }

  /* ---------------- Submission card ---------------- */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .sub-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 1.1rem 1.2rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .sub-card:hover { border-color: var(--sage); }
  .sub-card:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

  .sub-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 3px;
    white-space: nowrap;
  }
  .badge.pending { background: #F4ECD8; color: var(--amber); }
  .badge.approved { background: #E3ECE0; color: var(--moss); }
  .badge.rejected { background: #F5E4DF; color: var(--error); }

  .sub-date {
    font-size: 0.78rem;
    color: #9A9585;
  }

  .sub-excerpt {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--ink);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------------- Detail overlay ---------------- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 32, 24, 0.4);
    z-index: 10;
    padding: 0;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.visible { display: flex; }

  @media (min-width: 640px) {
    .overlay { align-items: center; }
  }

  .detail-panel {
    background: var(--cream);
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 1.75rem 1.5rem calc(1.75rem + env(safe-area-inset-bottom, 0px));
    border-top: 3px solid var(--forest);
  }

  @media (min-width: 640px) {
    .detail-panel { border-top: none; border-left: 3px solid var(--forest); }
  }

  .detail-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }

  .detail-close {
    background: none;
    border: none;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0.2rem 0.4rem;
  }

  .detail-text {
    font-size: 1.02rem;
    line-height: 1.75;
    white-space: pre-wrap;
    color: var(--ink);
    margin: 0 0 1.75rem;
  }

  .detail-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 120px;
    padding: 0.75rem 1rem;
    font-family: 'Public Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .action-btn:disabled { opacity: 0.6; cursor: progress; }

  .action-btn.approve { background: var(--forest); color: var(--cream); }
  .action-btn.approve:hover { background: var(--moss); }

  .action-btn.reject { background: transparent; color: var(--error); border-color: var(--error); }
  .action-btn.reject:hover { background: #F5E4DF; }

  .action-btn.reset { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .action-btn.reset:hover { border-color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div>
      <div class="brand">
        <span class="brand-badge">HC</span>
        <span>Admin</span>
      </div>
      <nav class="filters" id="filters">
        <button class="filter-btn active" data-status="all">All <span class="filter-count" id="count-all"></span></button>
        <button class="filter-btn" data-status="pending">Pending <span class="filter-count" id="count-pending"></span></button>
        <button class="filter-btn" data-status="approved">Approved <span class="filter-count" id="count-approved"></span></button>
        <button class="filter-btn" data-status="rejected">Rejected <span class="filter-count" id="count-rejected"></span></button>
      </nav>
    </div>
    <div class="sidebar-foot">
      <div id="signed-in-as"></div>
      <button class="signout-btn" id="signout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h1 id="main-title">All submissions</h1>
      <p>Review anonymous stories before they're shared with the community.</p>
    </div>

    <div id="list-area">
      <div class="state-msg" id="state-msg">Loading submissions…</div>
      <div class="card-list" id="card-list"></div>
    </div>
  </main>

</div>

<!-- Detail overlay -->
<div class="overlay" id="overlay">
  <div class="detail-panel">
    <div class="detail-top">
      <span class="badge" id="detail-badge"></span>
      <button class="detail-close" id="detail-close" aria-label="Close">✕</button>
    </div>
    <p class="detail-text" id="detail-text"></p>
    <div class="detail-actions">
      <button class="action-btn approve" id="approve-btn">Approve</button>
      <button class="action-btn reject" id="reject-btn">Reject</button>
      <button class="action-btn reset" id="reset-btn">Reset to pending</button>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // Supabase setup — same project as the login page
  // ---------------------------------------------------------------
  const SUPABASE_URL = 'https://aahszrjkrrqlcepcbrvq.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_MVWku_DfV6iX1HSY-BpEvw_x6Fj9NAg';

  // Where to send people who aren't signed in.
  const LOGIN_URL = 'hc-admin-login.html';

  // Table + column names — update these if your real schema differs.
  const TABLE_NAME = 'Submissions';
  const COL_ID = 'id';
  const COL_CONTENT = 'content';
  const COL_STATUS = 'status';       // expected values: 'pending' | 'approved' | 'rejected'
  const COL_CREATED = 'created_at';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  let allSubmissions = [];
  let activeFilter = 'all';
  let activeDetailId = null;

  const stateMsg = document.getElementById('state-msg');
  const cardList = document.getElementById('card-list');
  const mainTitle = document.getElementById('main-title');
  const signedInAs = document.getElementById('signed-in-as');
  const overlay = document.getElementById('overlay');
  const detailText = document.getElementById('detail-text');
  const detailBadge = document.getElementById('detail-badge');

  // ---------------- Auth guard ----------------
  sb.auth.getSession().then(({ data }) => {
    if (!data.session) {
      window.location.href = LOGIN_URL;
      return;
    }
    signedInAs.textContent = data.session.user.email;
    loadSubmissions();
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      window.location.href = LOGIN_URL;
    }
  });

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  // ---------------- Load + render ----------------
  async function loadSubmissions() {
    stateMsg.style.display = 'block';
    stateMsg.classList.remove('error');
    stateMsg.textContent = 'Loading submissions…';
    cardList.innerHTML = '';

    const { data, error } = await sb
      .from(TABLE_NAME)
      .select('*')
      .order(COL_CREATED, { ascending: false });

    if (error) {
      stateMsg.classList.add('error');
      stateMsg.textContent = 'Could not load submissions: ' + error.message +
        ' — check that the table/column names in this file match your Supabase schema.';
      return;
    }

    allSubmissions = data || [];
    updateCounts();
    render();
  }

  function updateCounts() {
    const counts = { all: allSubmissions.length, pending: 0, approved: 0, rejected: 0 };
    allSubmissions.forEach(s => {
      const status = (s[COL_STATUS] || 'pending').toLowerCase();
      if (counts[status] !== undefined) counts[status]++;
    });
    document.getElementById('count-all').textContent = counts.all;
    document.getElementById('count-pending').textContent = counts.pending;
    document.getElementById('count-approved').textContent = counts.approved;
    document.getElementById('count-rejected').textContent = counts.rejected;
  }

  function render() {
    const filtered = activeFilter === 'all'
      ? allSubmissions
      : allSubmissions.filter(s => (s[COL_STATUS] || 'pending').toLowerCase() === activeFilter);

    cardList.innerHTML = '';

    if (filtered.length === 0) {
      stateMsg.style.display = 'block';
      stateMsg.classList.remove('error');
      stateMsg.textContent = activeFilter === 'all'
        ? 'No submissions yet.'
        : 'Nothing in "' + activeFilter + '" right now.';
      return;
    }

    stateMsg.style.display = 'none';

    filtered.forEach(sub => {
      const status = (sub[COL_STATUS] || 'pending').toLowerCase();
      const card = document.createElement('div');
      card.className = 'sub-card';
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="sub-card-top">
          <span class="badge ${status}">${status}</span>
          <span class="sub-date">${formatDate(sub[COL_CREATED])}</span>
        </div>
        <p class="sub-excerpt">${escapeHtml(sub[COL_CONTENT] || '')}</p>
      `;
      card.addEventListener('click', () => openDetail(sub[COL_ID]));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(sub[COL_ID]); }
      });
      cardList.appendChild(card);
    });
  }

  function formatDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------------- Filters ----------------
  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.status;
    mainTitle.textContent = activeFilter === 'all'
      ? 'All submissions'
      : activeFilter.charAt(0).toUpperCase() + activeFilter.slice(1) + ' submissions';
    render();
  });

  // ---------------- Detail overlay ----------------
  function openDetail(id) {
    activeDetailId = id;
    const sub = allSubmissions.find(s => s[COL_ID] === id);
    if (!sub) return;
    const status = (sub[COL_STATUS] || 'pending').toLowerCase();
    detailBadge.className = 'badge ' + status;
    detailBadge.textContent = status;
    detailText.textContent = sub[COL_CONTENT] || '';
    overlay.classList.add('visible');
  }

  function closeDetail() {
    overlay.classList.remove('visible');
    activeDetailId = null;
  }

  document.getElementById('detail-close').addEventListener('click', closeDetail);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDetail();
  });

  async function setStatus(newStatus) {
    if (activeDetailId === null) return;
    const buttons = document.querySelectorAll('.action-btn');
    buttons.forEach(b => b.disabled = true);

    const { error } = await sb
      .from(TABLE_NAME)
      .update({ [COL_STATUS]: newStatus })
      .eq(COL_ID, activeDetailId);

    buttons.forEach(b => b.disabled = false);

    if (error) {
      alert('Could not update status: ' + error.message);
      return;
    }

    const sub = allSubmissions.find(s => s[COL_ID] === activeDetailId);
    if (sub) sub[COL_STATUS] = newStatus;
    updateCounts();
    render();
    closeDetail();
  }

  document.getElementById('approve-btn').addEventListener('click', () => setStatus('approved'));
  document.getElementById('reject-btn').addEventListener('click', () => setStatus('rejected'));
  document.getElementById('reset-btn').addEventListener('click', () => setStatus('pending'));
</script>

</body>
</html>
